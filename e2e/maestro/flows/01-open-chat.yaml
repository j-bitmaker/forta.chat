appId: com.forta.chat
name: Open a chat from the list
tags:
  - auth
---
- clearState
- launchApp
- runFlow: ../subflows/dismiss-permissions.yaml
- runFlow: ../subflows/login.yaml

- extendedWaitUntil:
    visible: ${MAESTRO_E2E_TARGET_ROOM}
    timeout: 120000
- tapOn: ${MAESTRO_E2E_TARGET_ROOM}

# The header only renders once the room is actually open, so it is a better
# signal than the message list, which can be empty in a fresh chat.
- extendedWaitUntil:
    visible:
      id: "chat-header"
    timeout: 30000
