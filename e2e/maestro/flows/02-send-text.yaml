appId: com.forta.chat
name: Send a text message
tags:
  - auth
---
- clearState
- launchApp
- runFlow: ../subflows/dismiss-permissions.yaml
- runFlow: ../subflows/login.yaml

# The chat list is populated by the first Matrix sync, which on a cleared
# account takes minutes — longer than login itself.
- extendedWaitUntil:
    visible: ".*${MAESTRO_E2E_TARGET_ROOM}.*"
    timeout: 300000
- tapOn: ".*${MAESTRO_E2E_TARGET_ROOM}.*"
# The composer's placeholder never reaches Maestro: the WebView exposes the
# field as an EditText with an empty hint (Pixel 9, 2026-09-22), so it is
# addressed by position: it sits right of the «Emoji» button, the one composer
# control that carries text. The send button exists only once there is text.
- extendedWaitUntil:
    visible: "Emoji"
    timeout: 30000

# A unique body per run: asserting on a fixed string would pass on a message
# left behind by an earlier run.
- evalScript: ${output.body = 'maestro ' + Date.now()}
- tapOn:
    rightOf: "Emoji"
- inputText: ${output.body}
- hideKeyboard
# The send button reaches Android with no text or description at all (its
# icon-only markup is exported empty), so it is found as the control right of
# the composer, which now carries the typed body as its text.
- tapOn:
    rightOf: ${output.body}

# The optimistic echo appears immediately; this asserts it reached the timeline,
# not that the server accepted it.
- extendedWaitUntil:
    visible: ${output.body}
    timeout: 30000
