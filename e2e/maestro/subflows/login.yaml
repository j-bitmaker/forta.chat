appId: com.forta.chat
---
# Signs in with MAESTRO_E2E_PRIVATE_KEY. Never hardcode a key here — the file
# is committed; the key comes from .env through scripts/e2e-android.sh.
# Cold start lands on the welcome screen, not the form.
- extendedWaitUntil:
    visible: "Get Started"
    timeout: 90000
- tapOn: "Get Started"

- extendedWaitUntil:
    visible: "Sign In"
    timeout: 30000

# A Capacitor WebView exposes no resource-id for DOM nodes, so `data-testid`
# is invisible to Maestro, and the placeholder arrives as `hint`, not `text`.
# The field is addressed by its position under the label instead — see
# e2e/README.md.
- tapOn:
    below: "Private Key or Mnemonic"
- inputText: ${MAESTRO_E2E_PRIVATE_KEY}
- hideKeyboard

- tapOn: "Sign In"

# Login derives Matrix credentials and runs the first sync — minutes on a cold
# account, so this wait is deliberately generous.
- extendedWaitUntil:
    notVisible: "Signing in..."
    timeout: 180000
